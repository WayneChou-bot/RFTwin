# §50 Render 部署藍圖：一個 Web Service（Docker），後端同時服務前端 dist。
# 免費方案會閒置冷啟動（pre-roll 約 5–10 s）；health 503 停擺時自動重啟。
services:
  - type: web
    name: robot-factory-twin
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TWIN_CORS_ORIGINS        # 留空＝只接受同源（§53）；前端另掛網域才填 https://…
        value: ""
      - key: TWIN_RATE_LIMIT
        value: "1"
      - key: TWIN_HEALTH_STALL_S
        value: "10"
      - key: TWIN_XFF                 # Render 把真實 client IP 放在 X-Forwarded-For 第一段
        value: "first"
